<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <link
    rel="stylesheet"

<title>Insert title here</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
header, nav, aside, footer, section ,li, a{
	font-family: 'Jua', sans-serif;
} 




</style>

<script type="text/javascript">
	$(document).ready(()=>{
		$(document).on("keydown", "#word", (event)=>{
			if (event.key === "Enter") {
				event.preventDefault();
				$("#searshButton").trigger("click");
			}
		});

		$("#searshButton").on("click", ()=>{
			const words = ($("#word").val() || "").trim();
			const pageno = 1;
			location.href = "/shop/search?pageno=" + pageno + "&word=" + encodeURIComponent(words);
		});	
	});
</script>


</head>

	<script th:inline="javascript">
		$(document).on("click", "#food", (e)=> {
			// a태그는 클릭하면 이동(동작이 2개, 그때 두번째 동작을 막아버린다)
			e.preventDefault();
			
			const categList = {
				//pageno : 1
			};
			
			const arrayList = [11, 21];

			for(let i = 0; i < arrayList.length; i++){
				categList['categno'+i] = arrayList.at(i);
			}
			
			location.href = "/product/listByMultiCateg?"+$.param(categList);			
		});
		
		$(document).on("click", "#living", (e)=> {

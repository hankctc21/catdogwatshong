services:
  - type: web
    name: catdogwatshong
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: APP_BASE_URL
        sync: false
      - key: APP_MAIL_ENABLED
        value: false
      - key: APP_REQUIRE_EMAIL_VERIFICATION
        value: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: APP_SCHEDULER_POOL_SIZE
        value: 2
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=50 -XX:InitialRAMPercentage=10 -XX:MaxMetaspaceSize=128m -Xss256k -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom
      - key: RESOURCE_PATH
        value: file:/app/upload/
      - key: APP_UPLOAD_PRODUCTIMAGE_DIR
        value: /app/upload/productimage
      - key: UPLOAD_PATH
        value: /upload/**

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<title>Insert title here</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- <meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/> -->
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/nav.css">
<script
	src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="/script/main.js"></script>
<script src="/script/cart/cart_read.js"></script>

<style>
.item_amount span{
	display: inline-block;
	width: 28px;
	height: 28px;
	line-height: 28px;
	text-align: center;
	border: 1px solid gray;
	cursor: pointer;
}

.cart_image{
	width: 60px;
}
.cart-summary {
	margin-top: 14px;
	font-size: 24px;
	font-weight: 700;
	color: #0f172a;
	background: #f8fbff;
	border: 1px solid #dbeafe;
	border-radius: 10px;
	padding: 10px 14px;
	display: inline-block;
}
#total_price {
	color: #1d4ed8;
	font-size: 30px;
	margin-left: 6px;
}
#cart_div button {
	margin-right: 8px;
	padding: 9px 14px;
	border-radius: 8px;
	border: 1px solid #cbd5e1;
	background: #fff;
	font-weight: 600;
}
#delete_product {
	background: #fff7ed;
	border-color: #fdba74;
	color: #9a3412;
}
#order {
	background: #2563eb;
	color: #fff;
	border-color: #2563eb;
}


</style>
<script>
	
</script>
</head>
<body>
	<div id="page">
		<header id="header" th:replace="fragments/headerStore"></header>
		<nav id="nav" th:replace="fragments/navStore"></nav>
		<div id="main">
			<section id="section">
				<form action="" enctype="multipart/form-data"></form>
				<div id="cart_div" style="display: none;">
					<table class="table">
						<thead>
							<tr>
								<th colspan="4">주 문 목 록</th>
							</tr>
						</thead>
						<tbody id="list">
						</tbody>
					</table>
					<hr>
					<div class="cart-summary">
						총 주문 금액 : <span id="total_price"></span>
					</div>
					<div>
						<input type="checkbox" id="check_all">
						<button type="button" id="delete_product">선택상품 삭제</button>
						<button type="button" id='continueShopping'>쇼핑계속 하기</button>
						<button type="button" id='order'>주문하기</button>
						
					</div>
				</div>
				<div id="empty_cart_div" style="display: none;">
					<h1>장바구니가 비어있습니다</h1>
				</div>
				<hr>
			</section>
		</div>

		<footer id="footer" th:replace="fragments/footer"> </footer>
	</div>
</body>
</html>

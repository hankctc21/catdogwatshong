<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<title>Insert title here</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/nav.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="/script/main.js"></script>
<style>
	#section.order-history {
		max-width: 1120px;
		border: none;
		margin-top: 16px;
	}
	.order-history-title {
		font-size: 34px;
		margin: 6px 0 20px;
		color: #0f172a;
	}
	.order-card {
		background: #fff;
		border: 1px solid #e5e7eb;
		border-radius: 14px;
		box-shadow: 0 10px 26px rgba(15, 23, 42, 0.06);
		padding: 16px 18px;
		margin-bottom: 18px;
	}
	.order-card-head {
		display: flex;
		justify-content: space-between;
		align-items: center;
		gap: 8px;
		margin-bottom: 12px;
	}
	.order-date {
		font-size: 14px;
		color: #475569;
	}
	.order-status {
		background: #dbeafe;
		color: #1d4ed8;
		padding: 4px 10px;
		border-radius: 999px;
		font-size: 12px;
		font-weight: 700;
	}
	.order-table {
		width: 100%;
		border-collapse: collapse;
	}
	.order-table thead th {
		text-align: left;
		font-size: 13px;
		color: #64748b;
		border-bottom: 1px solid #e2e8f0;
		padding: 8px 6px;
	}
	.order-table tbody td {
		padding: 10px 6px;
		border-bottom: 1px solid #f1f5f9;
		vertical-align: middle;
		color: #0f172a;
	}
	.order-table tbody tr:last-child td {
		border-bottom: none;
	}
	.order-product-cell {
		display: flex;
		align-items: center;
		gap: 10px;
	}
	.order-product-img {
		width: 52px;
		height: 52px;
		object-fit: cover;
		border-radius: 8px;
		border: 1px solid #e2e8f0;
	}
	.order-product-fallback {
		width: 52px;
		height: 52px;
		border-radius: 8px;
		border: 1px dashed #cbd5e1;
		background: #f8fafc;
		color: #64748b;
		font-size: 11px;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.order-product-name {
		font-weight: 700;
	}
	.order-review-done {
		font-size: 12px;
		color: #64748b;
		font-weight: 600;
	}
	.empty-order {
		text-align: center;
		padding: 70px 20px;
		color: #64748b;
		font-size: 18px;
	}
</style>
<script>
	let orders = undefined;
	const formatWon = (value)=> Number(value || 0).toLocaleString("ko-KR") + "원";
	const resolveImageSrc = (image)=>{
		if(!image) return "/products/image?imagename=__missing__";
		if(image.startsWith("/product/image?imagename=")) {
			const imageName = image.split("imagename=")[1] || "";
			return "/products/image?imagename=" + encodeURIComponent(decodeURIComponent(imageName));
		}
		if(image.startsWith("/products/image?imagename=")) {
			const imageName = image.split("imagename=")[1] || "";
			return "/products/image?imagename=" + encodeURIComponent(decodeURIComponent(imageName));
		}
		if(image.startsWith("/products/image?imagename=")) return image;
		if(image.startsWith("/product/image?imagename=")) return image.replace("/product/image", "/products/image");
		return "/products/image?imagename=" + encodeURIComponent(image);
	};

	const main = {
		init: function() {
			$.ajax("/orders/payment").done(result=>{
				orders = result;
				this.printOrders();
			});
		},
		printOrders:function() {
			const $section = $("#section");
			$section.empty();
			$("<h2>").addClass("order-history-title").text("주문 내역").appendTo($section);
			if(!orders || orders.length===0) {
				$("<div>").addClass("empty-order").text("주문 내역이 없습니다.").appendTo($section);
				return;
			}
			$.each(orders, function(idx, order) {
				const $card = $("<div>").addClass("order-card").appendTo($section);
				const $head = $("<div>").addClass("order-card-head").appendTo($card);
				$("<div>").addClass("order-date").text("주문일: " + (order.createTime || "-") + " / 주문번호: " + order.orderNo).appendTo($head);
				$("<div>").addClass("order-status").text(order.deliveryStatus || "PAY").appendTo($head);

				const $table = $("<table>").addClass("order-table").appendTo($card);
				const $thead = $("<thead>").appendTo($table);
				const $theadTr = $("<tr>").appendTo($thead);
				$("<th>").text("브랜드").appendTo($theadTr);
				$("<th>").text("상품").appendTo($theadTr);
				$("<th>").text("단가").appendTo($theadTr);
				$("<th>").text("수량").appendTo($theadTr);
				$("<th>").text("금액").appendTo($theadTr);
				$("<th>").text("리뷰").appendTo($theadTr);
				const $tbody = $("<tbody>").appendTo($table);
				$.each(order.orderItems, function(idx, orderItem) {
					const $tr = $("<tr>").appendTo($tbody);
					$("<td>").text(orderItem.manufacturer).appendTo($tr);
					const $td = $("<td>").appendTo($tr);
					const $productCell = $("<div>").addClass("order-product-cell").appendTo($td);
					$("<img>")
						.addClass("order-product-img")
						.attr("src", resolveImageSrc(orderItem.image))
						.attr("loading", "lazy")
						.on("error", function() {
							$(this).replaceWith($("<div>").addClass("order-product-fallback").text("이미지 없음"));
						})
						.appendTo($productCell);
					$("<a>").addClass("order-product-name").attr("href", "/product/read?pno=" + orderItem.pno).text(orderItem.name).appendTo($productCell);
					$("<td>").text(formatWon(orderItem.price)).appendTo($tr);
					$("<td>").text((orderItem.count || 0) + "개").appendTo($tr);
					$("<td>").text(formatWon((orderItem.price || 0) * (orderItem.count || 0))).appendTo($tr);
					const $reviewTd = $("<td>").appendTo($tr);
					if(orderItem.isReviewAvailable===true) {
						$("<a>")
							.addClass("btn btn-sm btn-primary")
							.attr("href", "/product/reviewWrite?pno=" + orderItem.pno)
							.text("리뷰 작성")
							.appendTo($reviewTd);
					} else {
						$("<span>").addClass("order-review-done").text("리뷰 완료").appendTo($reviewTd);
					}
				});
			});
		}
	};
	
	window.onload = function() {
		main.init();
	}
	
</script>
</head>
<body>
<div id="page">
	<header id="header" th:replace="fragments/headerStore">
	</header>
	<nav id="nav" th:replace="fragments/navStore">
	</nav>
	<div id="main">
		<section id="section" class="order-history">
			
		</section>
	</div>
	<footer id="footer" th:replace="fragments/footer">
	</footer>
</div>
</body>
</html>
